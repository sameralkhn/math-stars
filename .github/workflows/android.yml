# يبني تطبيق الأندرويد (APK) وينشره في صفحة الإصدارات: android-latest
name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: Capacitor project
        working-directory: android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
      - name: Resources (icon, tones, google-services)
        run: |
          A=android/android/app
          mkdir -p $A/src/main/res/raw
          cp android/res/raw/*.ogg $A/src/main/res/raw/
          if [ -f android/google-services.json ]; then cp android/google-services.json $A/; else echo "::warning::android/google-services.json missing — push notifications disabled"; fi
          rm -rf $A/src/main/res/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do n=${d%%:*}; s=${d##*:}; mkdir -p $A/src/main/res/mipmap-$n
            convert icons/icon-512.png -resize ${s}x${s} $A/src/main/res/mipmap-$n/ic_launcher.png
            cp $A/src/main/res/mipmap-$n/ic_launcher.png $A/src/main/res/mipmap-$n/ic_launcher_round.png
            convert icons/icon-512.png -resize ${s}x${s} $A/src/main/res/mipmap-$n/ic_launcher_foreground.png; done
          sed -i 's/android:label="[^"]*"/android:label="نجوم الضرب"/' $A/src/main/AndroidManifest.xml || true
          VC=$(( $(date +%s) / 60 ))
          sed -i "s/versionCode [0-9]*/versionCode $VC/; s/versionName \"[^\"]*\"/versionName \"1.0.$GITHUB_RUN_NUMBER\"/" $A/build.gradle
      - name: Build
        working-directory: android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -q
      - name: Sign
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=android/android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -f 4 $IN aligned.apk
          $BT/apksigner sign --ks android/family.keystore --ks-pass pass:mathstars --key-pass pass:mathstars --ks-key-alias mathstars --out math-stars.apk aligned.apk
          $BT/apksigner verify math-stars.apk && ls -la math-stars.apk
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: تطبيق الأندرويد — نجوم الضرب
          body: "حمّل math-stars.apk وثبّته على جهاز أندرويد. التحديثات تُثبَّت فوق النسخة السابقة."
          files: math-stars.apk
          make_latest: false
          prerelease: true
