<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نجوم الضرب</title>
<meta name="theme-color" content="#1aa3e8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1b2a5c;--sky:#bfe6ff;--sun:#ffc531;--coral:#ff6b5b;--mint:#3ed6a0;--grape:#8a63ff;--paper:#fffaf0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Baloo Bhaijaan 2',Tahoma,Arial,sans-serif;color:var(--navy);background:linear-gradient(#bfe6ff,#fffaf0 70%) fixed;user-select:none}
#app{max-width:640px;margin:auto;padding:12px 14px 40px}
header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
h1{flex:1;margin:0;font-size:26px;font-weight:800}
.ic,.st{border:0;border-radius:14px;background:#fff;padding:6px 12px;font:inherit;font-size:20px;box-shadow:0 3px 0 #0002;cursor:pointer}
.st{font-weight:800;font-size:18px}
button{font-family:inherit;color:inherit;cursor:pointer}
.owl{display:flex;gap:10px;align-items:center;background:#fff;border-radius:20px;padding:10px 14px;margin:6px 0 12px;box-shadow:0 3px 0 #0002}
.owl span{font-size:44px}.owl p{margin:0;font-size:16px;line-height:1.5}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.chip{border:3px solid transparent;background:#fff;border-radius:16px;padding:6px 0;font-size:26px;font-weight:800;box-shadow:0 4px 0 #0002;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.chip small{font-size:12px;color:#e8a400;letter-spacing:1px}
.chip.on{background:var(--sun);border-color:var(--navy);transform:translateY(2px)}
.m5{grid-column:1/-1;background:#1aa3e8;flex-direction:row!important;justify-content:center;gap:10px!important}
#stg{position:relative;height:270px;overflow:hidden;border-radius:22px;direction:ltr;background:linear-gradient(#ffb98a,#ffe3a8 35%,#6cc7ff 70%);box-shadow:inset 0 0 0 4px #fff;margin-bottom:12px}
#wd{position:absolute;top:0;left:0;height:100%;width:2400px;transition:transform 1.7s linear}
.pf{position:absolute;bottom:0;height:150px;background:linear-gradient(#8bdc4a 0 16px,#2fc9a0 16px);border-top:5px solid #5cbf2a;border-radius:24px 24px 0 0}
.br{position:absolute;bottom:136px;height:14px;border-radius:6px;background:repeating-linear-gradient(90deg,#b9783a 0 16px,#7b4a1c 16px 18px);transform:scaleX(0);transform-origin:left;transition:transform .9s}.br.on{transform:none}
.sea{position:absolute;left:0;right:0;bottom:0;height:44px;background:repeating-linear-gradient(100deg,#2b9be8 0 40px,#3aaaf0 40px 80px);opacity:.92;animation:wv 2s linear infinite}
@keyframes wv{to{background-position:80px 0}}@keyframes wk{50%{transform:translateY(-9px)}}
#kl{position:absolute;bottom:145px;line-height:1;transition:left 1.7s linear}#ks{display:inline-block;line-height:0}.wk{animation:wk .35s infinite}
#th{position:absolute;top:-34px;left:-6px;font-size:24px;opacity:0;transition:opacity .3s;white-space:nowrap}
.flag{position:absolute;bottom:145px;font-size:46px}
.hp{position:absolute;bottom:156px;font-size:50px;opacity:0;transition:opacity .4s}.hp.show{opacity:1;animation:hop .8s 2}
.dots{font-size:24px;margin-bottom:4px}
#jv{position:fixed;inset:0;z-index:5;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#jv #stg{position:absolute;inset:0;height:auto;border-radius:0;margin:0;box-shadow:none}
#jv #wd,#jv #kl{transition:none}
#jv #kl.fall{transition:bottom .9s ease-in;bottom:-80px}#kl.fall #ks{transform:rotate(200deg);transition:transform .9s}
#jh{position:absolute;top:8px;left:8px;display:flex;gap:6px;z-index:7;direction:ltr}
#jv #pan{position:absolute;top:8px;right:8px;z-index:6;width:min(58%,520px)}
#jv .card{padding:8px 12px;border-radius:18px;text-align:center}
#jv .q{font-size:28px!important;margin:0 0 6px}#jv .opts{grid-template-columns:repeat(4,1fr);gap:8px}#jv .opt{font-size:26px;padding:8px 0}#jv .dots{font-size:18px;margin:0}#jv .res{font-size:34px;margin:0}#jv h2{margin:0 0 4px;font-size:20px}
.ar{position:absolute;bottom:10px;width:78px;height:78px;border-radius:50%;border:0;background:#fffd;font-size:36px;box-shadow:0 5px 0 #0003;touch-action:none;z-index:7}#aL{left:14px}#aR{right:14px}
#rot{display:none;position:absolute;bottom:100px;left:0;right:0;text-align:center;font-weight:800;z-index:7;pointer-events:none}
@media (orientation:portrait){#rot{display:block}}
#aR{right:auto;left:106px}#aJ{right:14px;background:#ffc531}
.ob{position:absolute;bottom:145px;width:70px;display:flex;justify-content:center;align-items:flex-start;font-size:30px;line-height:1;transition:opacity .6s}
.ob.hill{background:linear-gradient(#7ed957,#46b83a);border-radius:34px 34px 0 0;box-shadow:inset -8px 0 0 #0002}
.ob.mount{background:linear-gradient(#fff 0 22px,#8a8fa3 22px,#5d6279);clip-path:polygon(0 100%,0 12%,50% 0,100% 12%,100% 100%)}
.ob.tn{opacity:.25}
.far{position:absolute;left:0;right:0;bottom:60px;height:46%;background:#7e92e8;opacity:.45;clip-path:polygon(0 100%,0 55%,10% 25%,20% 60%,32% 10%,45% 55%,58% 30%,70% 65%,82% 15%,94% 50%,100% 35%,100% 100%)}
.chip:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
.seg{display:flex;gap:8px;margin:-4px 0 14px}.seg button{flex:1;border:3px solid transparent;border-radius:14px;background:#fff;padding:8px 4px;font-size:15px;font-weight:800;box-shadow:0 3px 0 #0002}.seg .on{background:var(--mint);border-color:var(--navy)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big,.mode{border:0;border-radius:22px;padding:16px 8px;font-size:20px;font-weight:800;color:#fff;box-shadow:0 6px 0 #0003;transition:transform .1s}
.big:active,.mode:active,.opt:active,.row:active{transform:translateY(4px);box-shadow:0 2px 0 #0003}
.mode{display:flex;flex-direction:column;align-items:center;gap:2px}.mode i{font-style:normal;font-size:40px}
.m1{background:var(--coral)}.m2{background:var(--grape)}.m3{background:#18a999}.m4{background:#f08a00}.m6{background:#e8579a}.m7{background:#d99a00}
.big{width:100%;background:var(--grape);margin-top:12px}
.card{background:#fff;border-radius:24px;padding:18px;box-shadow:0 5px 0 #0002;text-align:center}
.q{font-size:48px;font-weight:800;direction:ltr;margin:4px 0 14px;text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:0;border-radius:18px;background:var(--sky);padding:14px 0;font-size:34px;font-weight:800;box-shadow:0 5px 0 #0003}
.opt.ok{background:var(--mint)}.opt.no{background:var(--coral);color:#fff}
.prog{height:12px;background:#fff;border-radius:9px;margin-bottom:12px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--mint);transition:width .4s}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{direction:ltr;border:0;border-radius:14px;background:#fff;padding:9px 0;font-size:20px;box-shadow:0 4px 0 #0002}
.row b{color:var(--coral)}.row.on{background:var(--sun)}
.tip{background:#fff;border-radius:16px;padding:10px 14px;margin:0 0 10px;font-size:16px;line-height:1.5}
.viz{display:grid;grid-auto-flow:column;gap:5px 9px;justify-content:center;background:#fff;border-radius:20px;padding:14px;margin-top:12px;min-height:90px;align-content:center}
.viz p{grid-row:1/-1;grid-column:1/-1;margin:0}
.dot{width:16px;height:16px;border-radius:50%;animation:pip .3s backwards}
.cap{text-align:center;font-weight:800;margin-top:6px}
#hud{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin-bottom:4px}
#field{position:relative;height:56vh;min-height:320px;overflow:hidden;border-radius:22px;background:linear-gradient(#7fd0ff,#d9f1ff);box-shadow:inset 0 0 0 4px #fff}
.b{position:absolute;bottom:-120px;width:20%;height:96px;display:flex;justify-content:center;animation:rise linear forwards}
.bl{width:72px;height:90px;border-radius:50% 50% 47% 47%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff;text-shadow:0 2px 0 #0004;position:relative;box-shadow:inset -8px -8px 0 #0002}
.bl:after{content:"";position:absolute;top:100%;left:50%;width:2px;height:26px;background:#fff9}
.bl.pop{animation:pop .35s forwards}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mc{height:84px;border:0;border-radius:18px;background:var(--grape);color:#fff;font-size:30px;font-weight:800;direction:ltr;box-shadow:0 5px 0 #0003}
.mc.up{background:#fff;color:var(--navy)}.mc.done{background:var(--mint);color:#fff}
.res{font-size:60px;margin:6px 0}.res+h2{margin:0 0 6px}
.fx{position:fixed;pointer-events:none;font-size:26px;z-index:9;animation:fly .9s ease-out forwards}
.cheer{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:6px 12px;margin-bottom:10px;box-shadow:0 3px 0 #0002}
.cheer span{font-size:42px;display:inline-block}.cheer p{flex:1;margin:0;font-weight:800;font-size:17px;line-height:1.4}.cheer b{color:var(--grape)}
.hop{animation:hop .6s}.sad{animation:wob .5s}.res{animation:hop 1s}
@keyframes hop{30%{transform:translateY(-22px) rotate(-12deg) scale(1.2)}60%{transform:translateY(0) rotate(10deg)}to{transform:none}}
@keyframes wob{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
@keyframes rise{to{transform:translateY(calc(-1 * var(--h)))}}
@keyframes pop{50%{transform:scale(1.4)}to{transform:scale(0);opacity:0}}
@keyframes pip{from{transform:scale(0)}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(240deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.b{animation-duration:30s!important}.fx{display:none}}
button:focus-visible{outline:4px solid var(--navy);outline-offset:2px}
#ks svg{width:96px;height:108px;display:block;margin:0 -19px}
.owl .av{width:52px;height:58px;flex:none;line-height:0}.owl .av svg,.mode .av2 svg,.pv svg,.gr svg{width:100%;height:100%;display:block}
.mode .av2{width:46px;height:52px;line-height:0}
.pv{width:130px;height:146px;margin:0 auto 8px}.nm{width:100%;font:inherit;font-size:20px;text-align:center;border:3px solid var(--sky);border-radius:14px;padding:8px;color:inherit;user-select:text}.sm{margin:6px 0 0;font-size:14px}
h3{margin:16px 0 8px;font-size:18px}.sw{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.sw button{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 0 #0003;background:#fff;font-size:18px;padding:0}.sw .on{border-color:var(--navy)}.sw input{width:38px;height:38px;border:0;padding:0;background:none}
.gr{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.gr button{aspect-ratio:1/1.12;border:3px solid transparent;border-radius:14px;background:#fff;padding:4px;box-shadow:0 3px 0 #0002}.gr .on{background:var(--sun);border-color:var(--navy)}
.gr button{position:relative}.gr .lk svg{opacity:.6}.pr{position:absolute;left:2px;bottom:2px;font-size:11px;font-weight:800;background:#fffd;border-radius:8px;padding:0 4px;line-height:1.4}
.stk{position:sticky;top:6px;z-index:3;display:flex;align-items:center;gap:12px;padding:8px 14px;margin-bottom:10px;text-align:right}.sp{width:96px;height:108px;flex:none}.buy{margin-top:4px;border:0;border-radius:12px;background:var(--mint);font:inherit;font-weight:800;padding:6px 12px;box-shadow:0 3px 0 #0003}.sp svg{width:100%;height:100%;display:block}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:20;background:#ffd23f;color:var(--navy);font-weight:800;padding:10px 18px;border-radius:18px;box-shadow:0 4px 0 #0003;pointer-events:none;animation:tin .3s;max-width:90%;text-align:center}
@keyframes tin{from{transform:translate(-50%,-30px);opacity:0}}
svg[class^=mv]{transform-origin:50% 85%}
.mv0{animation:mk0 .7s ease-in-out infinite}.mv1{animation:mk1 1.4s ease-in-out infinite}.mv2{animation:mk2 3s linear infinite}.mv3{animation:mk3 1s ease-in-out infinite}.mv4{animation:mk4 1s ease-in-out infinite}.mv5{animation:mk5 1.2s ease-in-out infinite}.mv6{animation:mk6 3s linear infinite}.mv7{animation:mk7 2s ease-in-out infinite}
@keyframes mk0{50%{transform:translateY(-7px)}}@keyframes mk1{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}@keyframes mk2{to{transform:rotateY(360deg)}}@keyframes mk3{50%{transform:scale(1.12)}}@keyframes mk4{0%,100%{transform:rotate(-8deg)}25%,75%{transform:translateY(-5px)}50%{transform:rotate(8deg)}}@keyframes mk5{50%{filter:drop-shadow(0 0 8px #ffd23f)}}@keyframes mk6{to{filter:hue-rotate(360deg)}}@keyframes mk7{50%{transform:translateY(-5px) scale(1.04)}}
.seg button small{font-size:12px}
/* ===== سباق السيارات ===== */
.m8{background:linear-gradient(90deg,#ff6b5b,#f08a00)!important}
.race{background:linear-gradient(#7fd0ff,#e6f6ff 40%)}
.race #rw{position:absolute;inset:0;pointer-events:none}
.wo{position:absolute;line-height:1}
.car{z-index:2}.car .cb{display:block;position:relative;line-height:0}.car .cb svg{display:block;filter:drop-shadow(0 3px 2px #0005)}
.car .dv{position:absolute;left:50%;top:50%;width:26px;height:30px;margin:-17px 0 0 -13px}.car .dv svg{width:100%;height:100%;display:block}
.car .nf{position:absolute;left:50%;bottom:-22px;margin-left:-12px;font-size:24px;line-height:1;opacity:0;transform:rotate(180deg);transition:opacity .2s}.car.nitro .nf{opacity:1}
.car.go .dv{animation:mk0 .4s infinite}.car.bump .cb{animation:shk .35s}
@keyframes shk{0%,100%{translate:0}25%{translate:-7px}75%{translate:7px}}
.it{font-size:30px;transition:transform .3s,opacity .3s}.it.got{opacity:0;transform:translate(-50%,-50%) scale(2)!important}
.ro{font-size:46px;display:flex;justify-content:space-around;transition:transform 1s,opacity 1s}.ro.gone{opacity:0}
.rhp{font-size:52px;opacity:0;transition:opacity .4s}.rhp.show{opacity:1}
.ls .hl{position:absolute;left:0;right:0;bottom:60%;height:80px;background:radial-gradient(circle at 50% 100%,#79d65a 58%,transparent 60%) 0 100%/240px 80px repeat-x}
.ls #hlB{height:120px;background:radial-gradient(circle at 50% 100%,#a9c7f0 58%,transparent 60%) 0 100%/420px 120px repeat-x;opacity:.85}
.ls .road{position:absolute;left:0;right:0;bottom:0;height:60%;background:linear-gradient(#9aa3b5 0 6px,#4e5566 6px)}
.ls .road::before{content:'';position:absolute;left:0;right:0;top:25%;height:5px;margin-top:-2px;background:#ffc531}
.ls .ln{position:absolute;left:0;right:0;top:50%;height:50%;margin-top:-3px;background:repeating-linear-gradient(90deg,#fff 0 46px,transparent 46px 92px) 0 0/auto 6px repeat-x,repeating-linear-gradient(90deg,#fff 0 46px,transparent 46px 92px) 0 50%/auto 6px repeat-x}
.ls .wo{transform:translate(-50%,50%)}.ls .car .cb{transform:rotate(-90deg)}
.ls .tr{bottom:62%;font-size:40px;transform:translateX(-50%)}
.ls .ro{bottom:22.5%;height:45%;flex-direction:column;align-items:center}.ls .ro.gone{transform:translate(-50%,-40%) rotate(40deg)}
.ls .fl{bottom:30%;height:60%;width:26px;background:repeating-conic-gradient(#222 0 25%,#fff 0 50%) 0 0/13px 13px}
#jv.pt{background:#7ed957}
.pt .road{position:absolute;top:0;bottom:0;left:10%;right:10%;background:linear-gradient(90deg,#9aa3b5 0 6px,#4e5566 6px calc(100% - 6px),#9aa3b5 calc(100% - 6px))}
.pt .road::before{content:'';position:absolute;top:0;bottom:0;left:25%;width:5px;margin-left:-2px;background:#ffc531}
.pt .ln{position:absolute;top:0;bottom:0;left:50%;width:50%;background:repeating-linear-gradient(180deg,#fff 0 46px,transparent 46px 92px) 0 0/6px auto repeat-y,repeating-linear-gradient(180deg,#fff 0 46px,transparent 46px 92px) 50% 0/6px auto repeat-y}
.pt .wo{transform:translate(-50%,-50%)}
.pt .tr{font-size:34px}
.pt .ro{left:60%;width:58%}.pt .ro.gone{transform:translate(-20%,-50%) rotate(30deg)}
.pt .fl{left:50%;width:80%;height:26px;background:repeating-conic-gradient(#222 0 25%,#fff 0 50%) 0 0/13px 13px}
#jv.pt #pan{left:8px;right:8px;width:auto;top:96px}
.pt #jh{flex-wrap:wrap;right:8px}.pt .trk{width:90px}
.pedals{position:absolute;right:12px;bottom:14px;display:flex;flex-direction:column;gap:12px;z-index:7}
.lpad{position:absolute;left:12px;bottom:14px;display:flex;flex-direction:column;gap:12px;z-index:7;align-items:flex-start}
.steer{display:flex;gap:10px;direction:ltr}
.pd{position:relative;border:0;border-radius:22px;width:84px;height:80px;font-size:32px;font-family:inherit;font-weight:800;color:#fff;box-shadow:0 6px 0 #0003;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;touch-action:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
.pd small{font-size:13px;margin-top:5px}
.pd.on,.pd:active{transform:translateY(4px);box-shadow:0 2px 0 #0003;filter:brightness(1.12)}
.gas{background:linear-gradient(#3ccf7e,#18a959);height:112px}.gas.on{outline:4px solid #fff;animation:mk0 .8s infinite}
.brk{background:linear-gradient(#ff6b6b,#d63c3c)}
.tbo{background:linear-gradient(#ffb340,#f07800)}
.st1{width:70px;height:70px;background:linear-gradient(#5b8cff,#3a63d6);font-size:28px}
.tbo b{position:absolute;top:-8px;right:-8px;background:#1b2a5c;color:#fff;border-radius:12px;padding:3px 8px;font-size:15px}
.tbo:disabled{filter:grayscale(1);opacity:.55}
.race:not(.drv) .pd{opacity:.5}.race:not(.drv) .gas{opacity:1}
.fuelb{display:flex;align-items:center;gap:6px;border:0;font:inherit;font-weight:800;cursor:pointer}
.fgw{display:inline-block;width:70px;height:12px;border-radius:7px;background:#dde3ee;overflow:hidden}.fgw i,.gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff5b5b,#ffc531 35%,#3ccf7e 70%)}
.fgw.low{animation:mk0 .6s infinite}
.gauge{height:14px;border-radius:8px;background:#e7ecf5;overflow:hidden;margin:6px 0}
.trk{position:relative;width:150px;height:16px;background:#fff;border-radius:9px;box-shadow:0 3px 0 #0002;align-self:center;margin-left:16px}
.trk b{position:absolute;left:-16px;top:-6px;font-size:18px}.trk i{position:absolute;top:-6px;font-size:18px;font-style:normal;transform:translateX(50%)}
.race .cd{font-size:80px!important}
.rin .seg{margin:8px 0 4px}.rcar{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0}
.gar{text-align:center}.gprev{display:flex;justify-content:center;padding:6px}
.gcol{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.gcol .sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #0002;cursor:pointer}.gcol .sw.on{box-shadow:0 0 0 3px var(--ink)}
.ggrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0 14px}
.ggrid .gc{background:#fff;border:0;border-radius:14px;padding:6px 0;box-shadow:0 3px 0 #0002;cursor:pointer;display:flex;justify-content:center}.ggrid .gc.on{background:var(--sun);box-shadow:0 0 0 3px var(--ink)}
.m9{background:linear-gradient(90deg,#8a63ff,#4aa3ff)!important}
.cap2{text-align:center;font-weight:800;color:var(--grape);min-height:22px;margin-top:4px}
.lo{padding:12px 14px;margin:12px 0 0;text-align:right}.lo .lr{margin:4px 0 10px}.lo .lr span{font-weight:800;font-size:15px}.lo .seg{margin:6px 0 0}.lo .seg button{padding:6px 4px;font-size:16px}
.fc{perspective:1000px;height:240px;margin:12px 0;cursor:pointer}
.fc .in{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,1.35,.5,1);transform-style:preserve-3d}
.fc.on .in{transform:rotateY(180deg)}
.fc .fa,.fc .fb{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 6px 0 #0002;direction:ltr;overflow:hidden;padding:8px}

// ===== الصوت المسجّل (ملفات audio/NN.mp3 بترتيب القائمة PH) =====

...['أحسنت يا بطل','أحسنت يا بطل، فزت بالسباق','المركز الثاني، كنت قريبًا جدًا','انطلق','حاول مرة أخرى','ربحت قفزة',

function sayA(t,cb){if(!HAS_A)return false;const m=String(t).match(/^(\d+) (?:ضرب|في) (\d+)(?: يساوي (\d+))?$/);let q;
if(m)q=[...numK(+m[1]),'ضرب',...numK(+m[2]),...(m[3]?['يساوي',...numK(+m[3])]:[])];else if(PI[t]!=null)q=[t];else return false;

L.forEach((x,j)=>{if(j){const k=q[j],pk=q[j-1];at+=k=='يساوي'?(sl?.5:.22):pk=='يساوي'?(sl?.38:.16):k[0]=='w'?.03:(sl?.2:.08)}

// PDF من صفحة واحدة فيها صورة اللوحة (يحافظ على الخط العربي كما يرسمه المتصفح)
function jpgPDF(c){const d=atob(c.toDataURL('image/jpeg',.9).split(',')[1]),img=new Uint8Array(d.length);for(let i=0;i<d.length;i++)img[i]=d.charCodeAt(i);
const enc=new TextEncoder(),parts=[],xr=[];let off=0;const push=v=>{const b=typeof v=='string'?enc.encode(v):v;parts.push(b);off+=b.length},obj=(n,f)=>{xr[n]=off;push(n+' 0 obj\n');f();push('\nendobj\n')};
push('%PDF-1.4\n');obj(1,()=>push('<</Type/Catalog/Pages 2 0 R>>'));obj(2,()=>push('<</Type/Pages/Kids[3 0 R]/Count 1>>'));
obj(3,()=>push('<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>'));
obj(4,()=>{push(`<</Type/XObject/Subtype/Image/Width ${c.width}/Height ${c.height}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${img.length}>>\nstream\n`);push(img);push('\nendstream')});
const cs='q 595 0 0 842 0 0 cm /Im0 Do Q';obj(5,()=>push(`<</Length ${cs.length}>>\nstream\n${cs}\nendstream`));
const xo=off;push('xref\n0 6\n0000000000 65535 f \n'+[1,2,3,4,5].map(n=>String(xr[n]).padStart(10,'0')+' 00000 n \n').join(''));push(`trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${xo}\n%%EOF`);
return new Blob(parts,{type:'application/pdf'})}

async function cpCreate(){const n=($('#cpn1').value||'').trim();if(!n){$('#cpn1').focus();return toast('✏️ اكتب اسمك أولًا')}S.cpme=n;save();try{let code,g=0;do{code=String(1000+R(9000));}while((await roomRef(code).get()).exists&&g++<8);
const N=S.cpq||100;await roomRef(code).set({host:UID,N,tabs:cpTabs(),seed:Date.now()%1e9,state:'wait',ts:Date.now(),players:{[UID]:newP(n)}});cpRoom(code)}catch(e){netErr(e)}}
async function cpJoin(){const code=($('#cpcode').value||'').replace(/\D/g,''),n=($('#cpn1').value||'').trim();if(!n){$('#cpn1').focus();return toast('✏️ اكتب اسمك أولًا')}if(code.length!=4)return toast('اكتب رمز الغرفة من 4 أرقام');S.cpme=n;save();
try{const d=await roomRef(code).get();if(!d.exists)return toast('لا توجد غرفة بهذا الرمز');const r=d.data();if(r.state!='wait'&&!(r.players||{})[UID])return toast('المسابقة بدأت بالفعل');
const mine=(r.players||{})[UID];if(!mine)await roomRef(code).update({['players.'+UID]:newP(n)});else if(mine.n!=n)await roomRef(code).update({['players.'+UID+'.n']:n});cpRoom(code)}catch(e){netErr(e)}}
function cpRoom(code){cpOff();CP={mode:'net',code,view:'lobby',P:[],me:null};cpLobby();CP.uns=roomRef(code).onSnapshot(cpSnap,netErr)}
function cpSnap(d){if(!CP||CP.mode!='net')return;if(!$('#cpx')&&CP.view!='lobby')return cpOff();if(!d.exists)return;const r=CP.room=d.data(),pl=r.players||{};
CP.P=Object.keys(pl).map(u=>Object.assign({u},pl[u]));CP.host=r.host==UID;
if(CP.view=='lobby'){if(r.state=='wait')return cpLobby();if(r.state=='play'||r.state=='end'){CP.N=r.N;CP.Q=genQs(r.N,r.tabs,r.seed);CP.me=Object.assign({},pl[UID]||newP(S.cpme||NM()));CP.view='play';
 if(r.state=='end'||CP.me.done)return cpWait();return cpNetGo()}}
const all=CP.P.length&&CP.P.every(p=>p.done);
if(r.state=='end'||all){if(CP.host&&r.state!='end')roomRef(CP.code).update({state:'end'}).catch(()=>{});if(CP.view!='end'){CP.view='end';cpEnd(CP.P)}return}
if(CP.view=='wait')cpWait();else cpLive()}

function merge(a,b){const o=Object.assign({},b,a,(a.ts||0)>(b.ts||0)?a:b),U=(x,y)=>[...new Set([...Object.keys(x||{}),...Object.keys(y||{})])];

['gd','cc','cj'].forEach(k=>o[k]=Math.max(a[k]||0,b[k]||0));return o}
